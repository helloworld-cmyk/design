<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a class="brand" href="{{home}}" aria-label="Vi Vu Việt — Trang chủ">
      <span class="brand-mark" aria-hidden="true">
        <img src="{{base}}shared/assets/logo.svg" alt="" width="42" height="42" />
      </span>
      <span class="brand-name">Vi Vu <span>Việt</span></span>
    </a>

    <nav class="main-nav" aria-label="Điều hướng chính">
      <a href="{{navPrefix}}#doi-xe">Đội xe</a>
      <a href="{{navPrefix}}#tuyen-duong">Tuyến đường</a>
      <a href="{{navPrefix}}#cach-hoat-dong">Cách hoạt động</a>
      <a href="{{navPrefix}}#vi-sao">Vì sao Vi Vu Việt</a>
      <a href="{{navPrefix}}#danh-gia">Đánh giá</a>
      <a href="{{navPrefix}}#faq">Hỏi đáp</a>
    </nav>

    <div class="header-actions">
      <div class="user-menu" id="userMenu">
        <button
          class="user-menu-btn"
          id="userMenuBtn"
          type="button"
          aria-label="Tài khoản"
          aria-expanded="false"
          aria-controls="userDropdown"
        >
          <span class="user-avatar" aria-hidden="true">
            <svg class="icon user-avatar-icon" aria-hidden="true">
              <use href="#i-user"></use>
            </svg>
            <span class="user-avatar-letter" id="userInitial">K</span>
          </span>
          <span class="user-menu-label" id="userMenuLabel">Tài khoản</span>
          <svg class="icon user-menu-caret" aria-hidden="true">
            <use href="#i-chevron-down"></use>
          </svg>
        </button>

        <div
          class="user-dropdown"
          id="userDropdown"
          aria-labelledby="userMenuBtn"
        >
          <div class="user-dropdown-head">
            <span class="user-avatar user-avatar--lg" aria-hidden="true">
              <svg class="icon user-avatar-icon" aria-hidden="true">
                <use href="#i-user"></use>
              </svg>
              <span class="user-avatar-letter" id="userInitialLg">K</span>
            </span>
            <span class="user-dropdown-id">
              <strong id="userName">Khách hàng</strong>
              <span id="userContact">Thành viên Vi Vu Việt</span>
            </span>
          </div>
          <a class="user-dropdown-item" href="{{profileHref}}">
            <svg class="icon" aria-hidden="true">
              <use href="#i-user"></use>
            </svg>
            Xem hồ sơ
          </a>
          <button
            class="user-dropdown-item user-dropdown-item--logout"
            type="button"
            data-user-logout
          >
            <svg class="icon" aria-hidden="true">
              <use href="#i-logout"></use>
            </svg>
            Đăng xuất
          </button>
        </div>
      </div>

      <a class="link-login" href="{{linkLoginHref}}">{{linkLoginLabel}}</a>
      <a class="btn btn-primary btn-sm header-cta" href="{{navPrefix}}#dat-xe">
        Đặt chuyến ngay
      </a>
      <button
        class="nav-toggle"
        id="navToggle"
        aria-expanded="false"
        aria-controls="mobileNav"
        aria-label="Mở menu"
      >
        <svg class="icon icon-menu" aria-hidden="true">
          <use href="#i-menu"></use>
        </svg>
        <svg class="icon icon-close" aria-hidden="true">
          <use href="#i-close"></use>
        </svg>
      </button>
    </div>
  </div>

  <div class="mobile-nav" id="mobileNav" hidden>
    <nav aria-label="Điều hướng di động">
      <a href="{{navPrefix}}#doi-xe">Đội xe</a>
      <a href="{{navPrefix}}#tuyen-duong">Tuyến đường</a>
      <a href="{{navPrefix}}#cach-hoat-dong">Cách hoạt động</a>
      <a href="{{navPrefix}}#vi-sao">Vì sao Vi Vu Việt</a>
      <a href="{{navPrefix}}#danh-gia">Đánh giá</a>
      <a href="{{navPrefix}}#faq">Hỏi đáp</a>
    </nav>
    <div class="mobile-nav-actions">
      <a class="btn btn-primary" href="{{navPrefix}}#dat-xe">Đặt chuyến ngay</a>
      <a class="link-login" href="{{linkLoginHref}}">{{linkLoginLabel}}</a>
    </div>
    <a class="mobile-hotline" href="tel:19001234">
      <svg class="icon" aria-hidden="true"><use href="#i-phone"></use></svg>
      Hotline 1900 1234
    </a>
  </div>
</header>
