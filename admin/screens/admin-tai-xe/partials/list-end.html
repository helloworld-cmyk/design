        </tbody>
      </table>
    </div>

    <div class="empty-state" data-table-empty>
      <span class="empty-icon" aria-hidden="true">
        <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg>
      </span>
      <h3>Không có tài xế phù hợp</h3>
      <p>
        Thử đổi từ khóa tìm kiếm hoặc chọn trạng thái khác để xem toàn bộ đội
        tài xế hiện có.
      </p>
      <button class="btn btn-ghost btn-sm" type="button" data-table-reset>
        Xóa bộ lọc
      </button>
    </div>

    <div class="table-foot">
      <p class="table-range" data-table-range>Hiển thị 1–8 của 10 tài xế</p>
      <div class="pager">
        <button class="btn btn-ghost btn-sm" type="button" data-page-prev>
          Trước
        </button>
        <span class="pager-page" data-page-current aria-live="polite">
          Trang 1/2
        </span>
        <button class="btn btn-ghost btn-sm" type="button" data-page-next>
          Sau
        </button>
      </div>
    </div>
  </div>
</section>
