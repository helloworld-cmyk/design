<section class="dt-section reveal" id="tong-quan-ky" aria-labelledby="kpi-title">
  <h2 class="sr-only" id="kpi-title">Chỉ số kỳ</h2>

  <div class="stat-grid">
    <article class="stat-card">
      <div class="stat-top">
        <span class="stat-label">Doanh thu thực thu</span>
        <span class="stat-icon stat-icon--sky">
          <svg class="icon" aria-hidden="true"><use href="#i-wallet"></use></svg>
        </span>
      </div>
      <p class="stat-value">46.750.000đ</p>
      <p class="stat-sub">
        <span class="stat-delta stat-delta--up">
          <svg class="icon" aria-hidden="true" width="13" height="13">
            <use href="#i-arrow-up-right"></use>
          </svg>
          +8,4%
        </span>
        so với tháng trước
      </p>
    </article>

    <article class="stat-card">
      <div class="stat-top">
        <span class="stat-label">Lãi gộp tạm tính</span>
        <span class="stat-icon stat-icon--green">
          <svg class="icon" aria-hidden="true"><use href="#i-chart"></use></svg>
        </span>
      </div>
      <p class="stat-value">24.850.000đ</p>
      <p class="stat-sub">Đã trừ tiền công tài xế 21.900.000đ</p>
    </article>

    <article class="stat-card">
      <div class="stat-top">
        <span class="stat-label">Vé đã thu</span>
        <span class="stat-icon stat-icon--navy">
          <svg class="icon" aria-hidden="true"><use href="#i-ticket"></use></svg>
        </span>
      </div>
      <p class="stat-value">214</p>
      <p class="stat-sub">Trên 258 vé đã đặt · chiếm 83%</p>
    </article>

    <article class="stat-card">
      <div class="stat-top">
        <span class="stat-label">Chuyến hoàn thành</span>
        <span class="stat-icon stat-icon--orange">
          <svg class="icon" aria-hidden="true"><use href="#i-car"></use></svg>
        </span>
      </div>
      <p class="stat-value">28</p>
      <p class="stat-sub">Trên 30 chuyến đã khởi hành</p>
    </article>
  </div>

  <div class="kpi-strip" role="list" aria-label="Số liệu bổ sung của kỳ">
    <div class="kpi-cell" role="listitem">
      <span class="kpi-icon kpi-icon--orange">
        <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
      </span>
      <div>
        <p class="kpi-label">Vé đã hủy</p>
        <p class="kpi-value">17</p>
      </div>
    </div>
    <div class="kpi-cell" role="listitem">
      <span class="kpi-icon kpi-icon--navy">
        <svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg>
      </span>
      <div>
        <p class="kpi-label">Không lên xe</p>
        <p class="kpi-value">9</p>
      </div>
    </div>
    <div class="kpi-cell" role="listitem">
      <span class="kpi-icon kpi-icon--sky">
        <svg class="icon" aria-hidden="true"><use href="#i-wallet"></use></svg>
      </span>
      <div>
        <p class="kpi-label">Tiền công tài xế</p>
        <p class="kpi-value">21.900.000đ</p>
      </div>
    </div>
  </div>
</section>
