<div class="tdh-modal" id="tdhConfirmModal" hidden aria-hidden="true">
  <div class="tdh-modal-backdrop" data-modal-close></div>
  <div
    class="tdh-modal-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="tdhConfirmTitle"
    aria-describedby="tdhConfirmText"
  >
    <div class="tdh-modal-head">
      <h2 id="tdhConfirmTitle">Xác nhận thao tác</h2>
      <button
        type="button"
        class="tdh-modal-close"
        data-modal-close
        aria-label="Đóng"
      >
        <svg class="icon" aria-hidden="true">
          <use href="#i-close"></use>
        </svg>
      </button>
    </div>

    <p class="tdh-modal-text" id="tdhConfirmText">
      Bạn có chắc muốn thực hiện thao tác này không?
    </p>

    <div class="tdh-modal-actions">
      <button type="button" class="btn btn-ghost" data-modal-close>
        Hủy
      </button>
      <button type="button" class="btn btn-primary" id="tdhConfirmOk">
        Xác nhận
      </button>
    </div>
  </div>
</div>
