<main id="main">
  <section class="profile-page" id="ho-so">
    <div class="container">
      <div class="profile-top">
        <span class="section-eyebrow">Tài khoản của bạn</span>
        <h1>Hồ sơ cá nhân</h1>
        <p>
          Cập nhật thông tin liên hệ và địa chỉ đón để đặt chuyến nhanh hơn —
          mọi thay đổi được áp dụng ngay cho lần đặt xe tiếp theo.
        </p>
      </div>

      <div class="profile-card reveal">
        <div class="profile-id">
          <div class="profile-avatar">
            <img
              class="profile-avatar-img"
              id="avatarImg"
              src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=240"
              alt="Ảnh đại diện của Nguyễn Thu Hà"
              width="92"
              height="92"
            />
            <button
              type="button"
              class="profile-avatar-btn"
              id="avatarBtn"
              aria-label="Đổi ảnh đại diện"
            >
              <svg class="icon" aria-hidden="true">
                <use href="#i-camera"></use>
              </svg>
            </button>
            <input
              type="file"
              id="avatarInput"
              accept="image/*"
              class="sr-only"
              aria-label="Chọn ảnh đại diện mới"
            />
          </div>

          <div class="profile-id-info">
            <div class="profile-name-row">
              <strong>Nguyễn Thu Hà</strong>
              <span class="badge badge--green">
                <svg class="icon" aria-hidden="true">
                  <use href="#i-check"></use>
                </svg>
                Đã xác thực
              </span>
            </div>
            <div class="profile-id-row">
              <span>
                <svg class="icon" aria-hidden="true">
                  <use href="#i-phone"></use>
                </svg>
                0912 345 678
              </span>
              <span>
                <svg class="icon" aria-hidden="true">
                  <use href="#i-mail"></use>
                </svg>
                thuha.nguyen@gmail.com
              </span>
            </div>
            <span class="profile-member">
              <svg class="icon" aria-hidden="true">
                <use href="#i-star"></use>
              </svg>
              Hạng Bạc · Tham gia từ 03/2025
            </span>
          </div>
        </div>
      </div>
    </div>
  </section>
