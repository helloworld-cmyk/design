<main id="main">
  <section class="booking-page" id="chi-tiet-chuyen">
    <div class="container">
      <div class="detail-top reveal">
        <span class="section-eyebrow">Xác nhận đặt chỗ</span>
        <h1>Chi tiết chuyến &amp; chọn ghế</h1>
      </div>

      <article class="ride-card detail-trip reveal" id="hanh-trinh">
        <div class="ticket-body">
          <div class="ride-card-top ticket-top">
            <div class="ticket-when">
              <span class="ride-eyebrow">
                Hà Nội → Ninh Bình · Thứ Năm, 29/10
              </span>
              <p class="ticket-time-range">
                <strong>06:30</strong>
                <span class="ticket-dash" aria-hidden="true">–</span>
                <span class="sr-only">đến</span>
                <strong>08:45</strong>
              </p>
            </div>
            <span class="badge badge--green">Còn 11 ghế</span>
          </div>

          <div class="ticket-route">
            <div class="ticket-stop">
              <div class="ticket-place">
                <strong>Hà Nội</strong>
                <span>Bến xe Mỹ Đình · Cổng 12</span>
              </div>
            </div>
            <span class="ticket-node marker-dot marker-dot--start"
              aria-hidden="true"></span>
            <div class="ticket-track" aria-hidden="true">
              <span class="ticket-dur">2h 15p</span>
              <span class="ticket-line"></span>
              <span class="ticket-note">Cao tốc CT.01</span>
            </div>
            <span class="ticket-node marker-dot marker-dot--end"
              aria-hidden="true"></span>
            <div class="ticket-stop ticket-stop--end">
              <div class="ticket-place">
                <strong>Ninh Bình</strong>
                <span>Trung tâm thành phố</span>
              </div>
            </div>
          </div>
        </div>

        <div class="ticket-stub">
          <p class="ride-price ticket-price">
            <strong>180.000đ</strong>
            <span>/ghế</span>
          </p>
        </div>
      </article>

      <div class="detail-grid">
